<div class="login-container">
  <div class="login-card">
    <h2>Login</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" formControlName="role" class="form-control">
          <option value="">Select your role</option>
          <option *ngFor="let role of userRoles" [value]="role">{{ role | titlecase }}</option>
        </select>
        <div *ngIf="f['role'].touched && f['role'].errors" class="error-message">
          <div *ngIf="f['role'].errors['required']">Role is required</div>
        </div>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" formControlName="username" class="form-control">
        <div *ngIf="f['username'].touched && f['username'].errors" class="error-message">
          <div *ngIf="f['username'].errors['required']">Username is required</div>
          <div *ngIf="f['username'].errors['minlength']">Username must be at least 4 characters</div>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" class="form-control">
        <div *ngIf="f['password'].touched && f['password'].errors" class="error-message">
          <div *ngIf="f['password'].errors['required']">Password is required</div>
          <div *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</div>
        </div>
      </div>

      <div *ngIf="showOtpField" class="form-group">
        <label for="otp">OTP (Sent to your phone)</label>
        <input type="text" id="otp" formControlName="otp" class="form-control">
        <small class="form-text text-muted">Check your phone for the verification code</small>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">{{ showOtpField ? 'Verify OTP' : 'Login' }}</span>
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      </button>
    </form>
  </div>
</div>
